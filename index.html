<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="한국 라디오" />
  <title>한국 라디오</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />

  <style>
    :root {
      --bg1: #101827;
      --bg2: #18243a;
      --card: rgba(255,255,255,.10);
      --card2: rgba(255,255,255,.16);
      --line: rgba(255,255,255,.18);
      --text: #f7fbff;
      --muted: rgba(247,251,255,.72);
      --gold: #ffd479;
      --pink: #ff8fab;
      --blue: #8bd3ff;
      --green: #92f2b8;
      --danger: #ff6b6b;
      --shadow: 0 24px 70px rgba(0,0,0,.35);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg1);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Segoe UI, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(255,212,121,.24), transparent 28%),
        radial-gradient(circle at 92% 10%, rgba(139,211,255,.20), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(255,143,171,.18), transparent 30%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 58%, #0b101d);
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }

    .app {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 18px 0 26px;
    }

    .hero {
      padding: 20px 18px 16px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      /* 수정 완료:
         기존 position: sticky 때문에 휴대폰에서 재생창이 위에 붙어서 채널을 가렸음.
         이제 화면을 위로 올리면 재생창도 같이 올라감. */
      position: relative;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--gold), #ff9f68);
      color: #1b1200;
      font-size: 25px;
      box-shadow: 0 12px 26px rgba(255, 188, 77, .25);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.6px;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      padding: 8px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .now {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .now-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .now-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    audio {
      width: 100%;
      height: 42px;
      border-radius: 20px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 2px;
    }

    button,
    .open-link {
      appearance: none;
      border: 0;
      border-radius: 18px;
      min-height: 46px;
      padding: 12px 14px;
      font-weight: 800;
      font-size: 14px;
      color: var(--text);
      background: rgba(255,255,255,.12);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: grid;
      place-items: center;
    }

    button.primary {
      color: #1a1303;
      background: linear-gradient(145deg, var(--gold), #ffb55b);
      border: 0;
    }

    button:active,
    .station:active,
    .chip:active,
    .open-link:active {
      transform: scale(.985);
    }

    .search-wrap {
      margin: 14px 0 12px;
      display: grid;
      gap: 10px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      background: rgba(255,255,255,.10);
      color: var(--text);
      border-radius: 20px;
      padding: 14px 15px;
      font-size: 15px;
    }

    .search::placeholder {
      color: rgba(247,251,255,.50);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      color: var(--text);
      background: rgba(255,255,255,.09);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .chip.active {
      background: rgba(255,212,121,.22);
      border-color: rgba(255,212,121,.55);
      color: #ffe7ad;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
      margin-top: 12px;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .now {
        grid-template-columns: 1fr 360px;
        align-items: center;
      }
    }

    .station {
      min-height: 126px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 14px 38px rgba(0,0,0,.18);
      cursor: pointer;
      display: grid;
      align-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .station::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -32px;
      top: -30px;
      border-radius: 50%;
      background: var(--accent, rgba(255,255,255,.18));
      opacity: .24;
    }

    .station.playing {
      outline: 2px solid rgba(255,212,121,.75);
      background: linear-gradient(145deg, rgba(255,212,121,.22), rgba(255,255,255,.08));
    }

    .badge {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 19px;
      background: var(--accent, rgba(255,255,255,.18));
      color: #101827;
      font-weight: 900;
      position: relative;
      z-index: 1;
    }

    .station h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: -.35px;
      position: relative;
      z-index: 1;
    }

    .station p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }

    .footer-note {
      color: rgba(247,251,255,.54);
      font-size: 12px;
      line-height: 1.55;
      padding: 18px 4px 2px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      width: min(430px, calc(100% - 28px));
      background: rgba(10, 14, 24, .92);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 14px;
      box-shadow: var(--shadow);
      transition: .25s ease;
      pointer-events: none;
      font-size: 13px;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden-player {
      display: none;
      width: 100%;
      height: 160px;
      border: 1px solid var(--line);
      border-radius: 22px;
      margin-top: 10px;
      background: rgba(255,255,255,.08);
    }

    .hidden-player.show {
      display: block;
    }

    .small-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="hero">
      <div class="topline">
        <div class="brand">
          <div class="logo">📻</div>
          <div>
            <h1>한국 라디오</h1>
            <p class="sub">GitHub Pages용 모바일 라디오 앱</p>
          </div>
        </div>
        <div class="status" id="status">대기중</div>
      </div>

      <div class="now">
        <div>
          <div class="now-title" id="nowTitle">채널을 선택하세요</div>
          <div class="now-meta" id="nowMeta">국내 채널만 담아둔 심플 라디오</div>
        </div>
        <audio id="audio" controls playsinline preload="none"></audio>
      </div>

      <div class="control-row">
        <button class="primary" id="playBtn">▶ 재생</button>
        <button id="stopBtn">■ 정지</button>
      </div>

      <div class="control-row">
        <a class="open-link" id="openLink" href="#" target="_blank" rel="noopener">새창 플레이어</a>
        <button id="fallbackBtn">안 나오면 보조재생</button>
      </div>

      <iframe id="fallbackFrame" class="hidden-player" title="보조 라디오 플레이어"></iframe>
      <p class="small-help">일부 방송은 브라우저/휴대폰에 따라 바로 재생이 막힐 수 있습니다. 그때는 “새창 플레이어” 또는 “보조재생”을 누르면 됩니다.</p>
    </section>

    <div class="search-wrap">
      <input class="search" id="searchInput" type="search" placeholder="채널 검색: KBS, MBC, SBS, CBS, EBS..." />
      <div class="chips" id="chips"></div>
    </div>

    <section class="grid" id="stationGrid"></section>

    <p class="footer-note">
      개인용/테스트용 라디오 앱입니다. 방송 스트림은 각 방송사 또는 공개 라디오 스트림 중계 주소에 의존하므로, 방송사 정책 변경 시 일부 채널이 멈출 수 있습니다.
    </p>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const PROVIDER_ORIGIN = "https://radio.bsod.kr";
    const API_BASE = `${PROVIDER_ORIGIN}/api/url`;
    const LEGACY_BASE = `${PROVIDER_ORIGIN}/stream`;
    const RESOLVE_TIMEOUT_MS = 8000;
    const HLS_LOAD_TIMEOUT_MS = 6000;
    const HLS_CDNS = [
      "https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js",
      "https://unpkg.com/hls.js@latest/dist/hls.min.js"
    ];

    let currentHls = null;
    let resolveController = null;
    let hlsLoadPromise = null;
    let playSequence = 0;
    let preparedStreamUrl = null;
    let preparedStationName = null;
    let preparePromise = null;

    const stations = [
      { name: "KBS 1라디오", group: "KBS", desc: "뉴스 · 시사 · 교양", icon: "K1", accent: "#ffd479", query: "stn=kbs&ch=1radio" },
      { name: "KBS 2라디오", group: "KBS", desc: "해피FM", icon: "K2", accent: "#ffb56b", query: "stn=kbs&ch=2radio" },
      { name: "KBS 1FM", group: "KBS", desc: "클래식FM", icon: "K1", accent: "#b8d9ff", query: "stn=kbs&ch=1fm" },
      { name: "KBS 2FM", group: "KBS", desc: "Cool FM", icon: "K2", accent: "#92f2b8", query: "stn=kbs&ch=2fm" },

      { name: "MBC 표준FM", group: "MBC", desc: "뉴스 · 시사 · 라디오", icon: "M", accent: "#8bd3ff", query: "stn=mbc&ch=sfm" },
      { name: "MBC FM4U", group: "MBC", desc: "음악 · 예능", icon: "4U", accent: "#ff8fab", query: "stn=mbc&ch=fm4u" },
      { name: "MBC 올댓뮤직", group: "MBC", desc: "음악 채널", icon: "AM", accent: "#d0b3ff", query: "stn=mbc&ch=chm" },

      { name: "SBS 러브FM", group: "SBS", desc: "러브FM", icon: "L", accent: "#ffa7a7", query: "stn=sbs&ch=lovefm" },
      { name: "SBS 파워FM", group: "SBS", desc: "파워FM", icon: "P", accent: "#ffcf7a", query: "stn=sbs&ch=powerfm" },
      { name: "SBS 고릴라디오M", group: "SBS", desc: "음악 전문", icon: "GM", accent: "#9ff0d0", query: "stn=sbs&ch=dmb" },

      { name: "EBS FM", group: "공영", desc: "교육 · 교양", icon: "E", accent: "#a7e7ff", query: "stn=ebs" },
      { name: "YTN 라디오", group: "뉴스", desc: "뉴스 전문", icon: "Y", accent: "#86b7ff", query: "stn=ytn" },
      { name: "TBS FM", group: "교통", desc: "서울 교통 · 생활", icon: "T", accent: "#ffd479", query: "stn=tbs&ch=fm" },
      { name: "TBN 경인교통방송", group: "교통", desc: "교통 정보", icon: "TN", accent: "#92f2b8", query: "stn=tbn" },

      { name: "CBS 표준FM", group: "CBS", desc: "시사 · 교양", icon: "C", accent: "#b7d2ff", query: "stn=cbs&ch=sfm" },
      { name: "CBS 음악FM", group: "CBS", desc: "음악FM", icon: "CM", accent: "#ffe29a", query: "stn=cbs&ch=mfm" },
      { name: "CBS JOY4U", group: "CBS", desc: "CCM · 음악", icon: "J", accent: "#b9f5d0", query: "stn=cbs&ch=joy4u" },

      { name: "BBS 서울불교방송", group: "종교", desc: "불교방송", icon: "B", accent: "#dac1ff", query: "stn=bbs" },
      { name: "FEBC 서울극동방송", group: "종교", desc: "극동방송", icon: "F", accent: "#ffc7dc", query: "stn=febc" },
      { name: "국악방송", group: "음악", desc: "국악 전문", icon: "국", accent: "#ffd479", query: "stn=kugak" },
      { name: "국방FM", group: "공공", desc: "국방 라디오", icon: "D", accent: "#b8f2a3", query: "stn=kookbang" },
      { name: "iFM 경인방송", group: "지역", desc: "인천 · 경기", icon: "i", accent: "#8bd3ff", query: "stn=ifm" },
      { name: "OBS 라디오", group: "지역", desc: "수도권 라디오", icon: "O", accent: "#ffb56b", query: "stn=obs" }
    ];

    const PROXY_BASE = "https://radio-stream-proxy-topaz.vercel.app/api/stream";

    const STATIC_FALLBACKS = {
      "MBC 표준FM": `${PROXY_BASE}?station=mbc-sfm`,
      "MBC FM4U": `${PROXY_BASE}?station=mbc-fm4u`,
      "MBC 올댓뮤직": `${PROXY_BASE}?station=mbc-chm`,
      "TBN 경인교통방송": `${PROXY_BASE}?station=tbn-gyeongin`,
      "FEBC 서울극동방송": `${PROXY_BASE}?station=febc-seoul`,
      "EBS FM": "https://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8",
      "YTN 라디오": "https://radiolive.ytn.co.kr/radio/_definst_/20211118_fmlive/playlist.m3u8",
      "TBS FM": "https://cdnfm.tbs.seoul.kr/tbs/_definst_/tbs_fm_web_360.smil/playlist.m3u8",
      "CBS 표준FM": "https://m-aac.cbs.co.kr/mweb_cbs981/_definst_/cbs981.stream/playlist.m3u8",
      "CBS 음악FM": "https://m-aac.cbs.co.kr/mweb_cbs939/_definst_/cbs939.stream/playlist.m3u8",
      "CBS JOY4U": "https://m-aac.cbs.co.kr/mweb_cbscmc/_definst_/cbscmc.stream/playlist.m3u8",
      "BBS 서울불교방송": "https://bbslive.clouducs.com/bbsradio-mlive/radio.stream/playlist.m3u8",
      "국악방송": "https://mgugaklive.nowcdn.co.kr/gugakradio/gugakradio.stream/playlist.m3u8",
      "국방FM": "https://mediaworks.dema.mil.kr/live_edge/audio.sdp/playlist.m3u8",
      "iFM 경인방송": "https://stream.ifm.kr/live/aod1/playlist.m3u8",
      "OBS 라디오": "https://vod3.obs.co.kr:444/live/obsstream1/radio.stream/playlist.m3u8"
    };

    const KBS_CODES = {
      "1radio": "21",
      "2radio": "22",
      "1fm": "24",
      "2fm": "25"
    };

    const TBN_GYEONGIN_PRIMARY = "https://www.tbn.it.kr/gyeongin/myStream/playlist.m3u8";
    const TBN_GYEONGIN_ALT = "https://5cc6beb04faf6.streamlock.net/gyeongin/myStream/playlist.m3u8";

    const groups = ["전체", ...Array.from(new Set(stations.map(s => s.group)))];

    const audio = document.getElementById("audio");
    const grid = document.getElementById("stationGrid");
    const nowTitle = document.getElementById("nowTitle");
    const nowMeta = document.getElementById("nowMeta");
    const statusEl = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const openLink = document.getElementById("openLink");
    const fallbackBtn = document.getElementById("fallbackBtn");
    const fallbackFrame = document.getElementById("fallbackFrame");
    const searchInput = document.getElementById("searchInput");
    const chips = document.getElementById("chips");
    const toast = document.getElementById("toast");

    let selected = null;
    let activeGroup = "전체";

    function apiUrl(station) {
      return `${API_BASE}?${station.query}`;
    }

    function legacyJsonUrl(station) {
      return `${LEGACY_BASE}?${station.query}&format=json`;
    }

    function legacyStreamUrl(station) {
      return `${LEGACY_BASE}?${station.query}`;
    }

    function isSafeStreamUrl(value) {
      try {
        const url = new URL(value);
        if (!["https:", "http:"].includes(url.protocol)) return false;
        if (url.username || url.password) return false;
        if (location.protocol === "https:" && url.protocol !== "https:") return false;
        return true;
      } catch {
        return false;
      }
    }

    function destroyHls() {
      if (currentHls) {
        try { currentHls.destroy(); } catch {}
        currentHls = null;
      }
    }

    function abortResolve() {
      if (resolveController) {
        try { resolveController.abort(); } catch {}
        resolveController = null;
      }
    }

    function clearAudioSource() {
      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const existing = Array.from(document.scripts).find(script => script.src === url);
        if (existing && window.Hls) {
          resolve();
          return;
        }

        const script = document.createElement("script");
        const timer = setTimeout(() => {
          script.remove();
          reject(new Error("HLS_SCRIPT_TIMEOUT"));
        }, HLS_LOAD_TIMEOUT_MS);

        script.src = url;
        script.async = true;
        script.crossOrigin = "anonymous";
        script.referrerPolicy = "no-referrer";

        script.onload = () => {
          clearTimeout(timer);
          if (window.Hls) resolve();
          else reject(new Error("HLS_GLOBAL_MISSING"));
        };

        script.onerror = () => {
          clearTimeout(timer);
          script.remove();
          reject(new Error("HLS_SCRIPT_LOAD_FAILED"));
        };

        document.head.appendChild(script);
      });
    }

    async function ensureHlsLibrary() {
      if (window.Hls) return true;
      if (hlsLoadPromise) return hlsLoadPromise;

      hlsLoadPromise = (async () => {
        for (const url of HLS_CDNS) {
          try {
            await loadScript(url);
            if (window.Hls) return true;
          } catch {}
        }
        return false;
      })();

      try {
        return await hlsLoadPromise;
      } finally {
        hlsLoadPromise = null;
      }
    }

    async function fetchJsonStreamUrl(url) {
      abortResolve();
      const controller = new AbortController();
      resolveController = controller;
      const timer = setTimeout(() => controller.abort(), RESOLVE_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`STREAM_API_HTTP_${response.status}`);
        }

        const data = await response.json();
        if (!data || typeof data.url !== "string" || !isSafeStreamUrl(data.url)) {
          throw new Error("INVALID_STREAM_URL");
        }

        return data.url;
      } finally {
        clearTimeout(timer);
        if (resolveController === controller) resolveController = null;
      }
    }

    async function resolveStreamUrl(station) {
      const endpoints = [apiUrl(station), legacyJsonUrl(station)];
      let lastError = null;

      for (const endpoint of endpoints) {
        try {
          return await fetchJsonStreamUrl(endpoint);
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("STREAM_RESOLVE_FAILED");
    }

    async function playDirectUrl(url, seq) {
      if (seq !== playSequence) return;
      if (!isSafeStreamUrl(url)) throw new Error("UNSAFE_STREAM_URL");

      destroyHls();
      openLink.href = url;
      audio.src = url;
      audio.load();
      await audio.play();
    }

    async function playWithHlsJs(url, seq) {
      if (seq !== playSequence) return;

      const loaded = await ensureHlsLibrary();
      if (!loaded || !window.Hls || !Hls.isSupported()) {
        throw new Error("HLS_JS_UNAVAILABLE");
      }

      await new Promise((resolve, reject) => {
        const hls = new Hls();
        currentHls = hls;
        let settled = false;
        let recoveredNetwork = false;
        let recoveredMedia = false;

        const fail = (error) => {
          if (settled) return;
          settled = true;
          if (currentHls === hls) {
            try { hls.destroy(); } catch {}
            currentHls = null;
          }
          reject(error);
        };

        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
          if (seq !== playSequence) {
            fail(new Error("STALE_PLAY_REQUEST"));
            return;
          }
          hls.loadSource(url);
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (seq !== playSequence) {
            fail(new Error("STALE_PLAY_REQUEST"));
            return;
          }

          audio.play().then(() => {
            if (!settled) {
              settled = true;
              resolve();
            }
          }).catch(fail);
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (!data || !data.fatal || settled) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR && !recoveredNetwork) {
            recoveredNetwork = true;
            try {
              hls.startLoad();
              return;
            } catch {}
          }

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recoveredMedia) {
            recoveredMedia = true;
            try {
              hls.recoverMediaError();
              return;
            } catch {}
          }

          fail(new Error("HLS_FATAL_ERROR"));
        });

        hls.attachMedia(audio);
      });
    }

    async function playStreamUrl(url, seq) {
      if (!isSafeStreamUrl(url)) throw new Error("UNSAFE_STREAM_URL");

      const isHls = /\.m3u8(?:$|[?#])/i.test(url);
      const nativeHls = isHls &&
        typeof audio.canPlayType === "function" &&
        audio.canPlayType("application/vnd.apple.mpegurl") !== "";

      if (isHls && !nativeHls) {
        const loaded = await ensureHlsLibrary();
        if (loaded && window.Hls && Hls.isSupported()) {
          return playWithHlsJs(url, seq);
        }
      }

      return playDirectUrl(url, seq);
    }

    async function fetchTextUrl(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), RESOLVE_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP_${response.status}`);
        const value = (await response.text()).trim();
        if (!isSafeStreamUrl(value)) throw new Error("INVALID_DIRECT_URL");
        return value;
      } finally {
        clearTimeout(timer);
      }
    }

    async function resolveBroadcasterDirect(station) {
      const params = new URLSearchParams(station.query);
      const stn = params.get("stn");
      const ch = params.get("ch");

      if (stn === "kbs" && KBS_CODES[ch]) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), RESOLVE_TIMEOUT_MS);
        try {
          const response = await fetch(
            `https://kbs-api-proxy.bsod.workers.dev/${KBS_CODES[ch]}`,
            {
              cache: "no-store",
              credentials: "omit",
              referrerPolicy: "no-referrer",
              signal: controller.signal
            }
          );
          if (!response.ok) throw new Error(`KBS_HTTP_${response.status}`);
          const data = await response.json();
          const url = data?.channel_item?.[0]?.service_url;
          if (!isSafeStreamUrl(url)) throw new Error("INVALID_KBS_URL");
          return url;
        } finally {
          clearTimeout(timer);
        }
      }

      if (stn === "mbc") {
        const channel = ch === "fm4u" ? "mfm" : ch;
        if (["sfm", "mfm", "chm"].includes(channel)) {
          return fetchTextUrl(
            `https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=${channel}`
          );
        }
      }

      if (stn === "sbs") {
        const endpoints = {
          "lovefm": "https://apis.sbs.co.kr/play-api/1.0/livestream/lovepc/lovefm?protocol=hls&ssl=Y",
          "powerfm": "https://apis.sbs.co.kr/play-api/1.0/livestream/powerpc/powerfm?protocol=hls&ssl=Y",
          "dmb": "https://apis.sbs.co.kr/play-api/1.0/livestream/sbsdmbpc/sbsdmb?protocol=hls&ssl=Y"
        };
        if (endpoints[ch]) return fetchTextUrl(endpoints[ch]);
      }

      const staticUrl = STATIC_FALLBACKS[station.name];
      if (staticUrl) return staticUrl;

      throw new Error("NO_DIRECT_FALLBACK");
    }

    async function playLegacyFallback(seq) {
      if (!selected || seq !== playSequence) return;
      await playDirectUrl(legacyStreamUrl(selected), seq);
    }


    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function renderChips() {
      chips.innerHTML = groups.map(group => `
        <button class="chip ${group === activeGroup ? "active" : ""}" data-group="${group}">${group}</button>
      `).join("");

      chips.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeGroup = btn.dataset.group;
          renderChips();
          renderStations();
        });
      });
    }

    function stationMatches(station) {
      const q = searchInput.value.trim().toLowerCase();
      const groupOk = activeGroup === "전체" || station.group === activeGroup;
      const text = `${station.name} ${station.group} ${station.desc}`.toLowerCase();
      return groupOk && (!q || text.includes(q));
    }

    function renderStations() {
      const items = stations.filter(stationMatches);

      grid.innerHTML = items.map((station) => `
        <article class="station ${selected && selected.name === station.name ? "playing" : ""}"
          data-index="${stations.indexOf(station)}"
          style="--accent:${station.accent}">
          <div>
            <div class="badge">${station.icon}</div>
          </div>
          <div>
            <h2>${station.name}</h2>
            <p>${station.group} · ${station.desc}</p>
          </div>
        </article>
      `).join("");

      grid.querySelectorAll(".station").forEach(card => {
        card.addEventListener("click", () => selectStation(stations[Number(card.dataset.index)], true));
      });
    }

    async function prepareStationStream(station) {
      preparedStreamUrl = null;
      preparedStationName = null;

      const staticUrl = STATIC_FALLBACKS[station.name];
      if (staticUrl) {
        preparedStreamUrl = staticUrl;
        preparedStationName = station.name;
        return staticUrl;
      }

      const params = new URLSearchParams(station.query);
      const stn = params.get("stn");

      // MBC는 토큰형 스트림이라 중계 서버의 오래된 캐시를 재사용하면 만료될 수 있다.
      // getUrlCached()의 캐시 키에 bora가 포함되므로 매 선택마다 다른 값으로 새 URL을 발급받는다.
      if (stn === "mbc") {
        try {
          const freshMbcUrl = await fetchJsonStreamUrl(
            `${API_BASE}?${station.query}&bora=sbm-${Date.now()}`
          );
          preparedStreamUrl = freshMbcUrl;
          preparedStationName = station.name;
          return freshMbcUrl;
        } catch {}
      }

      // TBN 경인은 HTTPS 주소를 우선 사용하고, 재생 오류 시 보조 HTTPS 주소로 자동 전환한다.
      if (station.name === "TBN 경인교통방송") {
        preparedStreamUrl = TBN_GYEONGIN_PRIMARY;
        preparedStationName = station.name;
        return TBN_GYEONGIN_PRIMARY;
      }

      try {
        const relayUrl = await resolveStreamUrl(station);
        preparedStreamUrl = relayUrl;
        preparedStationName = station.name;
        return relayUrl;
      } catch {}

      try {
        const directUrl = await resolveBroadcasterDirect(station);
        preparedStreamUrl = directUrl;
        preparedStationName = station.name;
        return directUrl;
      } catch {}

      throw new Error("STREAM_PREPARE_FAILED");
    }

    function startPreparedPlayback(url, seq) {
      if (seq !== playSequence) return;
      if (!isSafeStreamUrl(url)) throw new Error("UNSAFE_STREAM_URL");

      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      openLink.href = url;

      const isHls = /\.m3u8(?:$|[?#])/i.test(url);
      const nativeHls = isHls &&
        typeof audio.canPlayType === "function" &&
        audio.canPlayType("application/vnd.apple.mpegurl") !== "";

      if (isHls && !nativeHls && window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        currentHls = hls;

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (!data || !data.fatal || currentHls !== hls) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            try {
              hls.startLoad();
              return;
            } catch {}
          }

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            try {
              hls.recoverMediaError();
              return;
            } catch {}
          }

          setStatus("오류");
          showToast("이 방송 스트림을 불러오지 못했습니다.");
        });

        // 사용자가 재생 버튼을 누른 같은 동작 안에서 MediaSource와 play()를 바로 연결한다.
        hls.loadSource(url);
        hls.attachMedia(audio);
        setStatus("연결중");

        const playPromise = audio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              if (seq === playSequence) setStatus("재생중");
            })
            .catch(() => {
              if (seq !== playSequence) return;
              setStatus("재생 준비");
              showToast("재생 버튼을 한 번 더 눌러주세요.");
            });
        }
        return;
      }

      audio.src = url;
      audio.load();
      setStatus("연결중");

      const playPromise = audio.play();
      if (playPromise && typeof playPromise.then === "function") {
        playPromise
          .then(() => {
            if (seq === playSequence) setStatus("재생중");
          })
          .catch(() => {
            if (seq !== playSequence) return;
            setStatus("재생 준비");
            showToast("재생 버튼을 한 번 더 눌러주세요.");
          });
      }
    }

    function startImmediateChannelPlayback(station) {
      const seq = ++playSequence;

      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      // 안드로이드 Chrome: 사용자 터치가 살아 있는 동안 HLS MediaSource와 play()를 먼저 활성화한다.
      // 실제 방송 URL은 이미 시작된 preparePromise가 끝나는 즉시 같은 HLS 인스턴스에 넣는다.
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        currentHls = hls;

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (!data || !data.fatal || currentHls !== hls || seq !== playSequence) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            try {
              hls.startLoad();
              return;
            } catch {}
          }

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            try {
              hls.recoverMediaError();
              return;
            } catch {}
          }

          setStatus("재생 준비");
        });

        hls.attachMedia(audio);
        setStatus("연결중");

        // 이 호출은 반드시 채널 클릭과 같은 사용자 제스처 안에서 실행한다.
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              if (seq === playSequence) setStatus("재생중");
            })
            .catch(() => {
              // URL 로드 전 NotAllowed/NotSupported가 나더라도 HLS 준비는 계속 진행한다.
              if (seq === playSequence) setStatus("연결중");
            });
        }

        const loadPreparedUrl = async () => {
          try {
            let url = null;

            if (preparedStreamUrl && preparedStationName === station.name) {
              url = preparedStreamUrl;
            } else if (preparePromise) {
              await preparePromise;
              if (preparedStreamUrl && preparedStationName === station.name) {
                url = preparedStreamUrl;
              }
            } else {
              url = await prepareStationStream(station);
            }

            if (seq !== playSequence || currentHls !== hls) return;
            if (!url || !isSafeStreamUrl(url)) throw new Error("INVALID_PREPARED_URL");

            openLink.href = url;
            hls.loadSource(url);
          } catch {
            if (seq === playSequence && currentHls === hls) {
              setStatus("재생 준비");
            }
          }
        };

        loadPreparedUrl();
        return;
      }

      // 네이티브 HLS 기기에서는 준비된 URL이 이미 있으면 즉시 사용한다.
      if (preparedStreamUrl && preparedStationName === station.name) {
        openLink.href = preparedStreamUrl;
        audio.src = preparedStreamUrl;
        audio.load();
        setStatus("연결중");
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              if (seq === playSequence) setStatus("재생중");
            })
            .catch(() => {
              if (seq === playSequence) setStatus("재생 준비");
            });
        }
      } else {
        setStatus("재생 준비");
      }
    }

    async function selectStation(station, autoplay = true) {
      playSequence++;
      abortResolve();
      clearAudioSource();

      selected = station;
      nowTitle.textContent = station.name;
      nowMeta.textContent = `${station.group} · ${station.desc}`;
      openLink.href = legacyStreamUrl(station);
      openLink.textContent = "새창 플레이어";
      fallbackFrame.classList.remove("show");
      fallbackFrame.removeAttribute("src");
      localStorage.setItem("lastStation", station.name);

      renderStations();
      setStatus("주소 확인중");

      preparePromise = prepareStationStream(station)
        .then(() => {
          if (selected && selected.name === station.name) {
            setStatus("재생 준비");
          }
        })
        .catch(() => {
          if (selected && selected.name === station.name) {
            setStatus("주소 오류");
          }
        });

      // 채널을 누른 같은 사용자 터치 안에서 즉시 재생을 시작한다.
      // 준비된 실제 URL은 실패 시 재생 버튼의 2차 시도에 사용한다.
      if (autoplay) {
        startImmediateChannelPlayback(station);
      }
    }

    async function playSelected() {
      if (!selected) {
        await selectStation(stations[0], false);
      }

      if (!window.Hls) {
        setStatus("재생기 준비중");
        const loaded = await ensureHlsLibrary();
        if (!loaded) {
          setStatus("재생기 오류");
          showToast("HLS 재생기를 불러오지 못했습니다.");
          return;
        }

        setStatus("재생 준비");
        showToast("재생기가 준비됐습니다. 재생 버튼을 한 번 더 눌러주세요.");
        return;
      }

      if (!preparedStreamUrl || preparedStationName !== selected.name) {
        setStatus("주소 확인중");

        try {
          if (preparePromise) {
            await preparePromise;
          } else {
            await prepareStationStream(selected);
          }
        } catch {
          setStatus("주소 오류");
          showToast("방송 주소를 가져오지 못했습니다.");
          return;
        }

        // 비동기 주소 확인 뒤에는 사용자 제스처가 끝났으므로 한 번 더 누르게 한다.
        setStatus("재생 준비");
        showToast("방송 주소가 준비됐습니다. 재생 버튼을 한 번 더 눌러주세요.");
        return;
      }

      const seq = ++playSequence;

      try {
        startPreparedPlayback(preparedStreamUrl, seq);
      } catch {
        setStatus("오류");
        showToast("재생 준비 중 오류가 발생했습니다.");
      }
    }

    function stopAudio() {
      playSequence++;
      abortResolve();
      clearAudioSource();
      setStatus("정지");
    }

    async function showFallback() {
      if (!selected) {
        showToast("먼저 채널을 선택하세요.");
        return;
      }

      const seq = ++playSequence;
      abortResolve();
      clearAudioSource();

      try {
        setStatus("보조 연결중");
        await playLegacyFallback(seq);
        if (seq !== playSequence) return;
        setStatus("재생중 · 보조");
        showToast("기존 연결 방식으로 재생 중입니다.");
      } catch {
        if (seq !== playSequence) return;
        setStatus("보조재생 실패");
        showToast("보조 연결도 실패했습니다. 잠시 후 다시 시도해 주세요.");
      }
    }

    audio.addEventListener("playing", () => setStatus("재생중"));
    audio.addEventListener("waiting", () => setStatus("버퍼링"));
    audio.addEventListener("pause", () => setStatus("일시정지"));
    audio.addEventListener("error", () => {
      if (["연결중", "재생 준비", "주소 확인중", "재생기 준비중", "보조 연결중"].includes(statusEl.textContent)) return;
      setStatus(navigator.onLine ? "오류" : "오프라인");
    });

    window.addEventListener("offline", () => setStatus("오프라인"));
    window.addEventListener("online", () => {
      if (selected && audio.paused) setStatus("재생 대기");
    });

    playBtn.addEventListener("click", playSelected);
    stopBtn.addEventListener("click", stopAudio);
    fallbackBtn.addEventListener("click", showFallback);
    searchInput.addEventListener("input", renderStations);

    renderChips();
    renderStations();
    ensureHlsLibrary().catch(() => {});

    const lastName = localStorage.getItem("lastStation");
    const last = stations.find(s => s.name === lastName);

    if (last) {
      selectStation(last, false);
    } else {
      openLink.href = PROVIDER_ORIGIN;
    }

    /* 수정 완료:
       예전 service worker 캐시 때문에 이전 sticky 버전이 계속 보일 수 있어서
       등록된 service worker와 캐시를 정리함. */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(reg => reg.unregister()))
        .catch(() => {});
    }

    if (window.caches) {
      caches.keys()
        .then(keys => keys.forEach(key => caches.delete(key)))
        .catch(() => {});
    }
  </script>
</body>
</html>
